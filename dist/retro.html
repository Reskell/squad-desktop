<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>SQUAD//RETRO</title>
<!-- SQUAD//RETRO : la fenêtre locale de l'app, pensée comme le menu d'une
     console (profils avec avatar, accueil en jaquettes, plaza, réglages en
     tuiles). Elle ne dépend pas du site : c'est aussi la base de l'app
     publique. Toute la logique est dans le moteur (dépôt Squad-retro), appelée
     via les commandes retro_* (src-tauri/src/retro.rs). Aucun graphisme
     d'éditeur n'est livré : avatars et icônes sont dessinés ici, les jaquettes
     viennent de bases publiques au moment de l'affichage. -->
<style>
  :root { --accent:#7c5cff; --fond:#0a0d13; --carte:#131826; --carte2:#192033; --bord:#232a3d; --texte:#e7ecf6; --gris:#8b93a7; --ok:#3ecf8e; --attention:#f5b342; --erreur:#ff6b6b; --rayon:14px; }
  body.clair { --fond:#eef1f7; --carte:#ffffff; --carte2:#e6eaf2; --bord:#d5dbe7; --texte:#141a26; --gris:#5d6578; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--texte); font:14px/1.45 system-ui,"Segoe UI",sans-serif; display:grid; grid-template-columns:230px 1fr; height:100vh; overflow:hidden;
    background:var(--fond); background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--accent) 14%, transparent) 1px, transparent 0); background-size:26px 26px; animation:defile 60s linear infinite; }
  body.calme { animation:none; }
  @keyframes defile { to { background-position:260px 260px; } }
  @media (prefers-reduced-motion: reduce) { body { animation:none; } }
  aside { border-right:1px solid var(--bord); padding:18px 10px; display:flex; flex-direction:column; gap:2px; overflow:auto; background:color-mix(in srgb, var(--fond) 85%, transparent); }
  h1 { font-size:18px; letter-spacing:.08em; margin:0 10px 14px; }
  h1 span { color:var(--accent); }
  h2 { font-size:18px; margin:0 0 12px; }
  h3 { font-size:13px; margin:22px 0 10px; color:var(--gris); font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
  .nav { background:none; border:0; color:var(--texte); text-align:left; padding:9px 12px; border-radius:10px; cursor:pointer; font:inherit; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .nav:hover, .nav:focus-visible { background:var(--carte); outline:none; }
  .nav.active { background:var(--accent); color:#fff; }
  .nav small { color:var(--gris); }
  .nav.active small { color:#fff; }
  .pastille { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; }
  .pastille.non { background:var(--attention); }
  .sep { height:1px; background:var(--bord); margin:10px 6px; }
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  header { padding:12px 24px; border-bottom:1px solid var(--bord); display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:color-mix(in srgb, var(--fond) 85%, transparent); }
  input, select { background:var(--fond); color:var(--texte); border:1px solid var(--bord); border-radius:10px; padding:8px 10px; font:inherit; }
  input:focus, select:focus, button:focus-visible, .tuile:focus-visible, .jaq:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #recherche { flex:1; min-width:180px; }
  button.b { background:var(--carte); border:1px solid var(--bord); color:var(--texte); padding:8px 14px; border-radius:10px; cursor:pointer; font:inherit; }
  button.b:hover { border-color:var(--accent); }
  button.p { background:var(--accent); border:0; color:#fff; padding:9px 20px; border-radius:10px; cursor:pointer; font:inherit; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  #moi { display:flex; align-items:center; gap:8px; background:var(--carte); border:1px solid var(--bord); border-radius:30px; padding:3px 12px 3px 3px; cursor:pointer; color:var(--texte); font:inherit; }
  #heure { color:var(--gris); font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
  #message { padding:8px 24px; min-height:34px; color:var(--gris); }
  #message.erreur { color:var(--erreur); } #message.ok { color:var(--ok); }
  #vue { overflow:auto; padding:6px 24px 40px; flex:1; }
  .grille { display:grid; gap:8px; }
  .jeu { background:var(--carte); border:1px solid var(--bord); border-radius:var(--rayon); padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .jeu .titre { font-weight:600; flex:1; min-width:200px; }
  .jeu .titre small { display:block; color:var(--gris); font-weight:400; font-size:12px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; background:var(--carte2); color:var(--gris); margin-right:4px; white-space:nowrap; }
  .badge.ok { color:var(--ok); } .badge.att { color:var(--attention); } .badge.err { color:var(--erreur); }
  .cartes { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:var(--rayon); padding:14px; }
  .carte b { display:block; margin-bottom:4px; }
  .carte small { color:var(--gris); }
  .vide { color:var(--gris); padding:30px 0; }
  .ligne { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .ligne label { color:var(--gris); min-width:150px; }
  code { font-size:12px; color:var(--gris); word-break:break-all; }
  pre { background:var(--carte); border:1px solid var(--bord); border-radius:10px; padding:12px; white-space:pre-wrap; font-size:12px; }
  .barre { height:8px; background:var(--carte2); border-radius:8px; overflow:hidden; margin:8px 0; }
  .barre div { height:100%; background:var(--accent); width:0; transition:width .3s; }

  /* Avatars */
  .avatar { display:inline-block; line-height:0; flex:none; }
  .avatar svg { display:block; }

  /* Accueil : bandeau Reprendre */
  .bandeau { display:grid; grid-template-columns:150px 1fr; gap:22px; align-items:center; background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 35%, var(--carte)), var(--carte)); border:1px solid var(--bord); border-radius:20px; padding:18px; }
  .bandeau .grand { font-size:24px; font-weight:700; margin:2px 0 4px; }
  .bandeau small { color:var(--gris); }
  .mini { display:flex; gap:10px; margin-top:12px; overflow:auto; padding-bottom:4px; }
  .mini .jaq { width:84px; flex:none; }

  /* Tuiles (consoles, réglages, profils) */
  .tuiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .tuile { position:relative; border:0; border-radius:18px; padding:16px; min-height:104px; text-align:left; cursor:pointer; color:#fff; font:inherit; display:flex; flex-direction:column; justify-content:space-between;
    background:linear-gradient(145deg, var(--c, var(--accent)), color-mix(in srgb, var(--c, var(--accent)) 55%, #000)); box-shadow:0 6px 16px rgba(0,0,0,.25); transition:transform .12s; }
  .tuile:hover, .tuile:focus-visible { transform:translateY(-3px); }
  .tuile b { font-size:17px; }
  .tuile small { opacity:.85; }
  .tuile .icone { position:absolute; right:12px; top:10px; opacity:.9; }
  .tuile.neutre { --c:var(--carte2); color:var(--texte); box-shadow:none; border:1px solid var(--bord); }
  .tuile.choisie { outline:3px solid var(--accent); outline-offset:2px; }

  /* Jaquettes */
  .filtres { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .filtres button { border-radius:20px; }
  .filtres button.actif { background:var(--accent); color:#fff; border-color:var(--accent); }
  .mosaique { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:14px; }
  .jaq { position:relative; aspect-ratio:3/4; border-radius:12px; overflow:hidden; cursor:pointer; background:linear-gradient(160deg, var(--c, var(--accent)), color-mix(in srgb, var(--c, var(--accent)) 40%, #000)); border:0; padding:0; color:#fff; font:inherit; box-shadow:0 4px 12px rgba(0,0,0,.3); transition:transform .12s; }
  .jaq:hover, .jaq:focus-visible { transform:scale(1.04); }
  .jaq img { width:100%; height:100%; object-fit:cover; display:block; }
  .jaq .jaq-titre { position:absolute; inset:auto 0 0 0; padding:18px 8px 7px; font-size:12px; font-weight:600; line-height:1.2; text-align:left; background:linear-gradient(transparent, rgba(0,0,0,.8)); }
  .jaq.sans .jaq-titre { inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:14px; background:none; padding:10px; }
  .jaq .point { position:absolute; top:6px; right:6px; width:10px; height:10px; border-radius:50%; border:2px solid #fff; }

  /* Panneaux par-dessus (profils, fiche d'un jeu) */
  .voile { position:fixed; inset:0; background:color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:10; padding:30px; overflow:auto; }
  .voile[hidden] { display:none; }
  .boite { background:var(--carte); border:1px solid var(--bord); border-radius:22px; padding:24px; width:min(820px,100%); max-height:100%; overflow:auto; }
  .qui { text-align:center; }
  .qui h2 { font-size:26px; margin:10px 0 24px; }
  .profils { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
  .profil { background:none; border:0; color:var(--texte); font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px; border-radius:18px; width:130px; }
  .profil .rond { width:110px; height:110px; border-radius:50%; background:var(--carte2); display:flex; align-items:center; justify-content:center; overflow:hidden; border:3px solid transparent; }
  .profil:hover .rond, .profil:focus-visible .rond { border-color:var(--accent); }
  .profil:focus-visible { outline:none; }
  .profil .plus { font-size:46px; color:var(--gris); }
  .profil small { color:var(--gris); }
  .fiche { display:grid; grid-template-columns:200px 1fr; gap:22px; }
  .fiche .jaq { cursor:default; }

  /* Créateur d'avatar */
  .createur { display:grid; grid-template-columns:220px 1fr; gap:24px; align-items:start; }
  .createur .apercu { background:var(--carte2); border-radius:20px; display:flex; justify-content:center; padding:10px; }
  .choix { display:grid; grid-template-columns:110px 1fr; gap:8px 12px; align-items:center; }
  .choix > span { color:var(--gris); }
  .fleches { display:flex; align-items:center; gap:8px; }
  .fleches b { min-width:96px; text-align:center; font-weight:500; }
  .nuancier { display:flex; gap:6px; flex-wrap:wrap; }
  .nuance { width:26px; height:26px; border-radius:50%; border:2px solid var(--bord); cursor:pointer; padding:0; }
  .nuance.choisie { border-color:var(--texte); transform:scale(1.15); }

  /* Plaza */
  .plaza { position:relative; height:330px; border-radius:22px; overflow:hidden; border:1px solid var(--bord);
    background:linear-gradient(color-mix(in srgb, var(--accent) 30%, #10142a), color-mix(in srgb, var(--accent) 10%, var(--fond)) 70%); }
  .plaza .sol { position:absolute; inset:auto 0 0 0; height:92px; background:linear-gradient(color-mix(in srgb, var(--accent) 22%, var(--carte2)), var(--carte)); border-top:2px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .plaza .bulle-fond { position:absolute; border-radius:50%; background:color-mix(in srgb, #fff 8%, transparent); }
  .habitant { position:absolute; bottom:30px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; cursor:pointer; background:none; border:0; color:var(--texte); font:inherit; padding:0; transition:opacity .3s; }
  .habitant .nom { font-size:12px; font-weight:600; background:var(--carte); border:1px solid var(--bord); border-radius:12px; padding:2px 8px; margin-bottom:4px; white-space:nowrap; }
  .habitant.moi .nom { background:var(--accent); color:#fff; border-color:var(--accent); }
  .habitant.absent { opacity:.55; }
  .habitant .avatar { animation:marche .6s ease-in-out infinite alternate; animation-play-state:paused; }
  .habitant.bouge .avatar { animation-play-state:running; }
  .habitant.gauche .avatar svg { transform:scaleX(-1); }
  @keyframes marche { from { transform:translateY(0); } to { transform:translateY(-4px); } }

  /* Fiche : onglets */
  .onglets { display:flex; gap:6px; margin:6px 0 12px; flex-wrap:wrap; }
  .onglets button.actif { background:var(--accent); color:#fff; border-color:var(--accent); }
  .statuts button.actif { background:var(--accent); color:#fff; border-color:var(--accent); }
  textarea { width:100%; min-height:80px; background:var(--fond); color:var(--texte); border:1px solid var(--bord); border-radius:10px; padding:8px 10px; font:inherit; }
  .etoile { font-size:20px; line-height:1; }
  .etoile.on { color:#f5b342; }
  /* Veille, mur de jaquettes, roue */
  #veille { position:fixed; inset:0; z-index:20; background:#000; overflow:hidden; cursor:none; }
  #veille[hidden] { display:none; }
  #veille .defile { display:grid; grid-template-columns:repeat(8, 1fr); gap:14px; padding:14px; animation:monte 120s linear infinite; }
  #veille .jaq { cursor:none; }
  #veille .heure { position:fixed; right:30px; bottom:24px; font-size:42px; font-weight:700; color:#fff; text-shadow:0 2px 12px #000; }
  @keyframes monte { from { transform:translateY(0); } to { transform:translateY(-50%); } }
  .roue { width:320px; height:320px; border-radius:50%; margin:10px auto; position:relative; border:6px solid var(--accent); transition:transform 4.2s cubic-bezier(.17,.85,.25,1); overflow:hidden; }
  .roue span { position:absolute; left:50%; top:50%; transform-origin:0 0; font-size:11px; font-weight:600; white-space:nowrap; color:#fff; text-shadow:0 1px 3px #000; }
  .fleche-roue { text-align:center; font-size:28px; color:var(--accent); margin-bottom:-14px; }
  .chargement { text-align:center; padding:20px; }
  .chargement .astuce { color:var(--gris); margin-top:14px; font-style:italic; }
  /* Stats */
  .barres { display:grid; gap:6px; }
  .barres .b2 { display:grid; grid-template-columns:130px 1fr 80px; gap:10px; align-items:center; }
  .barres .rempli { height:12px; border-radius:6px; background:var(--accent); }
  .chiffres { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .chiffres .carte b { font-size:24px; }
  /* Chat de la room */
  .chat { background:var(--fond); border:1px solid var(--bord); border-radius:10px; padding:8px 10px; height:160px; overflow:auto; margin:8px 0; font-size:13px; }
  .chat b { color:var(--accent); }

  /* Assistant manette */
  .pad { display:grid; grid-template-columns:repeat(4, minmax(120px,1fr)); gap:8px; margin:12px 0; }
  .touche { background:var(--carte); border:1px solid var(--bord); border-radius:10px; padding:10px; text-align:center; }
  .touche.allumee { background:var(--accent); border-color:var(--accent); color:#fff; }
  .touche small { display:block; color:var(--gris); font-size:11px; margin-top:2px; }
  .touche.allumee small { color:#fff; }
  .touche.attend { outline:2px dashed var(--attention); }
  .compte { font-size:48px; font-weight:700; text-align:center; padding:20px; color:var(--accent); }
  .places { display:grid; gap:6px; margin:10px 0; }
  .place { background:var(--carte); border:1px solid var(--bord); border-radius:10px; padding:6px 12px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .place > span:first-child { display:flex; align-items:center; gap:8px; }
</style>
</head>
<body>
<aside>
  <h1>SQUAD<span>//</span>RETRO</h1>
  <button class="nav" data-vue="accueil">Accueil</button>
  <button class="nav" data-vue="plaza">Plaza</button>
  <button class="nav" data-vue="room">Jouer en ligne</button>
  <button class="nav" data-vue="stats">Mon profil rétro</button>
  <div class="sep"></div>
  <div id="consoles"></div>
  <div class="sep"></div>
  <button class="nav" data-vue="installation">Émulateurs</button>
  <button class="nav" data-vue="reglages">Réglages</button>
</aside>
<main>
  <header>
    <input id="recherche" placeholder="Rechercher un jeu sur toutes les consoles…" />
    <select id="hasardJoueurs" title="Jeu au hasard">
      <option value="1">Au hasard : tous</option><option value="2">2 joueurs et +</option><option value="4">4 joueurs</option>
    </select>
    <button class="b" id="hasard">🎲 Au hasard</button>
    <button class="b" id="scanner">Rescanner</button>
    <span id="heure"></span>
    <button id="moi" title="Changer de profil"></button>
  </header>
  <div id="message"></div>
  <div id="vue"></div>
</main>
<div class="voile" id="voile" hidden><div class="boite" id="boite"></div></div>
<div id="veille" hidden></div>
<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const REGIONS = { france:"FR", europe:"EU", usa:"US", japon:"JP", monde:"Monde", autre:"?" };
const NOMS_PAD = { sud:"Bas (A / Croix)", est:"Droite (B / Rond)", ouest:"Gauche (X / Carré)", nord:"Haut (Y / Triangle)", l1:"L1 / LB", r1:"R1 / RB", l2:"L2 / LT", r2:"R2 / RT", l3:"Stick gauche (clic)", r3:"Stick droit (clic)", start:"Start", select:"Select / Back", haut:"Croix haut", bas:"Croix bas", gauche:"Croix gauche", droite:"Croix droite" };
// Les consoles prioritaires d'abord, chacune avec sa couleur de tuile.
const ORDRE_CONSOLES = ["gamecube", "wii", "n64", "snes", "nes", "ps1"];
const COULEUR = { gamecube:"#6a5acd", wii:"#2fa8e0", n64:"#2e9e5b", snes:"#8e7cc3", nes:"#e4002b", ps1:"#7d8590" };
// Nos palettes (aucune n'est la charte d'une marque).
const PALETTES = { squad:["SQUAD","#7c5cff"], corneille:["Corneille","#19b5a5"], indigo:["Indigo","#6a5acd"], ciel:["Ciel","#2fa8e0"], cerise:["Cerise","#e4002b"], lavande:["Lavande","#8e7cc3"], foret:["Forêt","#2e9e5b"], soleil:["Soleil","#f5a623"], braise:["Braise","#ff6b3d"], bonbon:["Bonbon","#ff6fb5"], menthe:["Menthe","#3ecf8e"] };
let etat = null, fiches = [], vue = "accueil", consoleActive = null, room = null, assistantEnCours = null, filtre = null, panneauReglages = "profil";

const memo = { lire: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, ecrire: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...enfants) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of enfants.flat()) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
};
function dire(t, genre = "") { $("#message").textContent = t; $("#message").className = genre; }
async function essayer(f, ok) { try { const r = await f(); if (ok) dire(typeof ok === "function" ? ok(r) : ok, "ok"); son("valider"); return r; } catch (e) { dire(String(e), "erreur"); son("erreur"); throw e; } }
const duree = (s) => s < 60 ? "" : s < 3600 ? `${Math.round(s / 60)} min jouées` : `${(s / 3600).toFixed(1)} h jouées`;
const ilYa = (vu) => { const s = Date.now() / 1000 - vu; return s < 3600 ? "à l'instant" : s < 86400 ? `il y a ${Math.round(s / 3600)} h` : `il y a ${Math.round(s / 86400)} j`; };
const nomConsole = (c) => etat?.consoles.find((x) => x.console === c)?.nom || c;
const ficheDe = (chemin) => fiches.find((f) => f.variantes.some((v) => v.chemin === chemin));

// ---------- Sons de menu (synthétisés, aucun fichier) ----------
let audio = null;
function son(genre) {
  if (etat?.reglages?.muet) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { deplacer:[[880, .03]], valider:[[523, .05], [784, .07]], retour:[[440, .05], [330, .06]], entrer:[[523, .06], [659, .06], [784, .1]], erreur:[[220, .12]] }[genre] || [];
    let t = audio.currentTime;
    for (const [f, d] of notes) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + d); t += d * .8;
    }
  } catch { /* pas de son disponible : rien de grave */ }
}

// ---------- Avatars (dessinés ici, formes maison) ----------
const TEINTS = ["#ffdbb4", "#f1c27d", "#e0ac69", "#c68642", "#8d5524", "#5c3a21"];
const CHEVEUX = ["#1d1d1d", "#4a2c17", "#8b5a2b", "#d9a441", "#e8e0d0", "#c0392b", "#2c7be5", "#7c5cff"];
const TENUES = ["#7c5cff", "#e4002b", "#2fa8e0", "#3ecf8e", "#f5b342", "#ff6fb5", "#2a3042", "#f2f2f2", "#19b5a5", "#ff8c42"];
const PARTIES = [
  ["visage", "Visage", ["Rond", "Ovale", "Carré"]],
  ["coiffure", "Coiffure", ["Aucune", "Courte", "Piques", "Longue", "Queue", "Volume", "Mèche", "Crête"]],

function filtrees() {
  const f = filtre;
  return fiches.filter((x) => {
    if (!f) return true;
    if (f === "@2") return x.joueurs >= 2;
    if (f === "@4") return x.joueurs >= 4;
    if (f === "@net") return x.netplay;
    if (f === "@fini") return ["fini", "cent"].includes(x.perso?.statut);
    if (f.startsWith("@")) return x.perso?.statut === f.slice(1);
    if (f.startsWith("#")) return (x.perso?.collections || []).includes(f.slice(1));
    if (f.startsWith("%")) return (x.perso?.etiquettes || []).includes(f.slice(1));
    return x.console === f;
  });
}
// Les séries : les jeux qui partagent le début de leur titre (« Mario Party », « Zelda »).
function seriesDe(liste) {
  const cle = (t) => t.replace(/^(the|le|la|les)\s+/i, "").split(/[:\-–]|\s\d|\s(?:II|III|IV|V|VI|64|DS|Advance)\b/)[0].trim().toLowerCase();
  const groupes = new Map();
  for (const f of liste) { const k = cle(f.titre); if (k.length < 3) continue; if (!groupes.has(k)) groupes.set(k, []); groupes.get(k).push(f); }
  return [...groupes.entries()].filter(([, l]) => l.length > 1).map(([k, l]) => [l[0].titre.slice(0, k.length).trim() || k, l]).sort((a, b) => b[1].length - a[1].length);
}

function roue(liste) {
  liste = liste.slice(0, 16);
  if (liste.length < 2) return dire("Il faut au moins deux jeux pour faire tourner la roue.", "erreur");
  const pas = 360 / liste.length;
  const couleurs = liste.map((f, i) => `${COULEUR[f.console] || "#7c5cff"} ${i * pas}deg ${(i + 1) * pas}deg`).join(",");
  const disque = el("div", { class: "roue", style: `background:conic-gradient(${couleurs})` }, liste.map((f, i) => el("span", { style: `transform:rotate(${i * pas + pas / 2 - 90}deg) translate(30px,-6px)` }, f.titre.slice(0, 22))));
  const gagnant = Math.floor(Math.random() * liste.length);
  ouvrirVoile(el("h2", { style: "text-align:center" }, "Roue de la fortune"), el("div", { class: "fleche-roue" }, "▼"), disque, el("div", { class: "ligne", style: "justify-content:center" }, el("button", { class: "b", onclick: fermerVoile }, "Fermer")));
  son("entrer");
  setTimeout(() => { disque.style.transform = `rotate(${360 * 6 - (gagnant * pas + pas / 2)}deg)`; }, 50);
  setTimeout(() => { son("valider"); dire(`La roue a choisi : ${liste[gagnant].titre} !`, "ok"); ouvrirFiche(liste[gagnant]); }, 4500);
}

    p.append(el("div", { class: "ligne" }, el("label", {}, "BIOS"), el("code", {}, etat.dossier_bios), el("button", { class: "b", onclick: () => invoke("retro_ouvrir_bios") }, "Ouvrir")));
    const doublons = await invoke("retro_doublons");
    p.append(el("div", { style: "margin-top:10px" }, doublons.length ? `${doublons.length} fichier(s) en double (même contenu) :` : "Aucun doublon."));
    for (const g of doublons) p.append(el("pre", {}, g.join("\n")));
    const gros = fiches.flatMap((f) => f.variantes.filter((x) => /\.(iso|gcm|wbfs|cue)$/i.test(x.chemin)).map((x) => ({ f, x })));
    if (gros.length) {
      p.append(el("div", { style: "margin-top:10px" }, "Images disque compressables sans perte (RVZ, CHD) :"));
      for (const { f, x } of gros) p.append(el("div", { class: "ligne" }, el("span", { style: "flex:1" }, x.nom), el("button", { class: "b", onclick: (e) => { e.target.disabled = true; dire(`Compression de ${f.titre}…`); essayer(async () => { const s = await invoke("retro_convertir", { chemin: x.chemin }); await scanner(); return s; }, (s) => `Compressé : ${s}. L'original est toujours là, tu peux le supprimer.`).catch(() => {}); } }, "Compresser")));
    }
  } else if (panneauReglages === "sauvegarde") {
    titre("Sauvegarde");
    p.append(el("div", { class: "ligne" },
      el("button", { class: "b", onclick: () => essayer(() => invoke("retro_exporter"), (c) => c ? `Sauvegarde écrite : ${c}` : "Annulé.") }, "Exporter tout (changer de PC)"),
      el("button", { class: "b", onclick: () => essayer(async () => { const n = await invoke("retro_restaurer"); await rafraichir(); return n; }, (n) => n == null ? "Annulé." : `${n} fichiers restaurés.`) }, "Restaurer…")));
  } else if (panneauReglages === "diagnostic") {
    titre("Diagnostic");
    const rapport = el("pre", {}, await invoke("retro_diagnostic"));
    p.append(el("div", { class: "ligne" }, el("button", { class: "b", onclick: () => navigator.clipboard.writeText(rapport.textContent).then(() => dire("Rapport copié : colle-le sur Discord.", "ok")) }, "Copier le rapport")), rapport);
  }
}
async function choisirDossier() { if (await invoke("retro_choisir_dossier")) { await rafraichir(); await scanner(); } }

// ---------- Manette : assistant et navigation (mode canapé) ----------
// Déplacement « spatial » : on va vers l'élément le plus proche dans la direction.
function voisin(depuis, direction, candidats) {
  const r0 = depuis.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
  let meilleur = null, score = Infinity;
  for (const c of candidats) {
    if (c === depuis) continue;
    const r = c.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, dx = x - cx, dy = y - cy;
    const ok = { droite: dx > 4, gauche: dx < -4, bas: dy > 4, haut: dy < -4 }[direction];
    if (!ok) continue;
    const principal = direction === "droite" || direction === "gauche" ? Math.abs(dx) : Math.abs(dy);
    const lateral = direction === "droite" || direction === "gauche" ? Math.abs(dy) : Math.abs(dx);
    const s = principal + lateral * 2.5;
    if (s < score) { score = s; meilleur = c; }
  }
  return meilleur;
}
listen("retro-manettes", () => rafraichir());
listen("retro-manette", ({ payload }) => {
  const { bouton, appuye } = payload;
  if (vue === "assistant" && assistantEnCours?.etapes[assistantEnCours.i]?.type === "test" && $("#voile").hidden) {
    const a = assistantEnCours;
    if (appuye && a.attend) { a.mapping[a.attend] = bouton; a.attend = null; dire(""); dessiner(); return; }
    for (const [id, phys] of Object.entries(a.mapping)) if (phys === bouton) document.querySelector(`.touche[data-id="${id}"]`)?.classList.toggle("allumee", appuye);
    return;
  }
  if (!appuye || !document.hasFocus()) return;
  if (reveil()) return;
  const racine = $("#voile").hidden ? document : $("#boite");
  const focusables = [...racine.querySelectorAll("button:not(:disabled), select, input")].filter((e) => e.offsetParent);
  const actuel = focusables.includes(document.activeElement) ? document.activeElement : null;
  if (["haut", "bas", "gauche", "droite"].includes(bouton)) {
    let cible = actuel ? voisin(actuel, bouton, focusables) : focusables[0];
    if (actuel && !cible) {
      // Pas de position connue (ou bord atteint) : ordre de lecture.
      const i = focusables.indexOf(actuel), pas = ["bas", "droite"].includes(bouton) ? 1 : -1;
      cible = focusables[Math.min(Math.max(i + pas, 0), focusables.length - 1)];
    }
    if (cible && cible !== actuel) { cible.focus(); cible.scrollIntoView?.({ block: "nearest" }); son("deplacer"); }
  } else if (bouton === "sud") actuel?.click();
  else if (bouton === "est") { if (!fermerVoile()) aller("accueil"); }
  else if (bouton === "nord") $("#hasard").click();
  else if (bouton === "start") ecranProfils();
});
listen("retro-installation", ({ payload }) => progres?.(payload));
listen("retro-partie", ({ payload }) => {
  clearTimeout(rappel);
  if (payload.en_cours) {
    // Rappel de pause au bout de 2 h de jeu.
    rappel = setTimeout(() => { dire(`Ça fait 2 h que tu joues à ${payload.titre} : pense à faire une pause, boire un verre d'eau.`, "ok"); son("entrer"); }, 2 * 3600 * 1000);
  } else { dire(`Partie de ${payload.titre} terminée.`); scanner(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerVoile(); });

// ---------- Démarrage ----------
async function rafraichir() { etat = await invoke("retro_etat"); dessinerNav(); }
async function scanner() {
  if (!etat.reglages.dossier_jeux) return;
  dire("Scan en cours…");
  try { fiches = await invoke("retro_bibliotheque"); dire(`${fiches.length} jeu${fiches.length > 1 ? "x" : ""} trouvé${fiches.length > 1 ? "s" : ""}.`, "ok"); }
  catch (e) { fiches = []; dire(String(e), "erreur"); }
  dessinerNav(); dessiner();
}
(async () => {
  if (memo.lire("calme")) document.body.classList.add("calme");
  await rafraichir(); await scanner(); dessiner();
  // « Qui joue ? » au démarrage, sauf si on entre directement avec le dernier profil.
  if (!etat.comptes.liste.length || !etat.reglages.entrer_direct || !compteActif()) ecranProfils();
  else { dire(`${salut()} ${monPseudo()} !`, "ok"); nouveautes(); }
})();
