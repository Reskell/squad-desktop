# Publier une version de l'app SQUAD.
#
# Il suffit de monter la version dans src-tauri/tauri.conf.json
# (0.1.1 -> 0.1.2…) et de pousser : la publication part toute seule.
# Si cette version est déjà publiée, le workflow s'arrête sans rien faire.
# Le bouton Run workflow (onglet Actions) reste là pour relancer à la main.
#
# Windows compile l'app, signe l'installeur avec la clé gardée dans les
# secrets du dépôt, et crée la version (tag v<version>) avec l'installeur et
# le fichier latest.json que lisent les apps déjà installées pour se mettre
# à jour toutes seules.
#
# La même version publie aussi « SQUAD Compagnon », le compagnon LoL seul
# (job compagnon) : même code compilé avec SQUAD_COMPAGNON_SEUL, réglages de
# src-tauri/tauri.compagnon.conf.json, en préversion taguée
# compagnon-v<version> pour ne jamais passer « dernière version » de SQUAD.
# Le site retrouve cette préversion pour le téléchargement et la mise à jour
# (squadlog, lib/compagnonSeul.ts).
name: Publier une version

on:
  push:
    branches: [main]
    paths: ['src-tauri/tauri.conf.json']
  workflow_dispatch:

# Une publication à la fois : la suivante attend, puis voit que la version
# existe déjà et s'arrête.
concurrency:
  group: publier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    outputs:
      nouvelle: ${{ steps.version.outputs.nouvelle }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "v$V est déjà publiée : rien à faire."
            echo "nouvelle=non" >> "$GITHUB_OUTPUT"
          else
            echo "v$V n'existe pas encore : on la publie."
            echo "nouvelle=oui" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: verifier
    if: needs.verifier.outputs.nouvelle == 'oui'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: SQUAD v__VERSION__
          releaseBody: >-
            Pour l'installer la première fois : télécharge SQUAD_…_x64-setup.exe
            ci-dessous et lance-le. Ensuite, l'app se met à jour toute seule.
          releaseDraft: false
          prerelease: false

  compagnon:
    needs: verifier
    if: needs.verifier.outputs.nouvelle == 'oui'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: compagnon

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SQUAD_COMPAGNON_SEUL: '1'
        with:
          args: --config src-tauri/tauri.compagnon.conf.json
          tagName: compagnon-v__VERSION__
          releaseName: SQUAD Compagnon v__VERSION__
          releaseBody: >-
            Le compagnon LoL seul. Pour l'installer : télécharge
            SQUAD.Compagnon_…_x64-setup.exe ci-dessous et lance-le. Ensuite, il se
            met à jour tout seul. (L'app SQUAD le contient déjà.)
          releaseDraft: false
          prerelease: true
