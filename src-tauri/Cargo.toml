[package]
name = "squad-desktop"
version = "0.1.0"
description = "L'app de bureau de SQUAD : le site SQUAD//LOG, plus ce qui demande le PC"
edition = "2021"

[lib]
name = "squad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
